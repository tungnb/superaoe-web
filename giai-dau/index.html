<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giải đấu Đế Chế (AoE) online – SuperAqE</title>
<meta name="description" content="Tạo và tham gia giải đấu Đế Chế (AoE Rise of Rome) online trên SuperAqE: 1-1 đến 4-4, loại trực tiếp hoặc vòng tròn tính điểm, chạm 2 / chạm 3, kết quả tự động và công khai.">
<link rel="canonical" href="https://superaqe.com/giai-dau/">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="Giải đấu Đế Chế – SuperAqE">
<meta property="og:description" content="Tổ chức giải Đế Chế online: chia nhánh, chạm 2, kết quả tự động và công khai.">
<meta property="og:url" content="https://superaqe.com/giai-dau/">
<meta property="og:image" content="https://superaqe.com/img/spectator.jpg">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root {
  --gold: #e8c35a; --gold2: #b8902f; --ink: #221a12;
  --bg: #140f0a; --bg2: #1c150e; --panel: #2c2218; --panel2: #3a2d1e;
  --line: #5a4728; --text: #f2e6cf; --dim: #b7a583; --red: #a33a32; --green: #4f9a5a;
  --serif: "Playfair Display", Georgia, serif;
  --sans: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.6; }
a { color: var(--gold); }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
.top { position: sticky; top: 0; z-index: 10; background: rgba(20,15,10,.88); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(184,144,47,.35); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-weight: 800; font-size: 22px; color: var(--gold); text-decoration: none; }
.brand img { width: 30px; height: 36px; }
.who { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--dim); }
.who b { color: var(--text); }
.who a { text-decoration: none; }
.links { display: flex; gap: 14px; font-size: 14px; }
.links a { color: var(--dim); text-decoration: none; }
.links a:hover, .links a.on { color: var(--gold); }
h1 { font-family: var(--serif); font-size: clamp(28px, 4vw, 38px); margin: 36px 0 6px; overflow-wrap: anywhere; }
h2 { font-family: var(--serif); font-size: 24px; margin: 0 0 14px; }
h3 { font-size: 16px; margin: 0 0 8px; color: var(--gold); }
.sub { color: var(--dim); margin: 0 0 24px; max-width: 760px; white-space: pre-wrap; overflow-wrap: anywhere; }
label { display: block; font-size: 14px; color: var(--dim); margin: 12px 0 4px; }
input, textarea, select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: #0e0b07; color: var(--text); font: inherit; }
textarea { resize: vertical; min-height: 60px; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--gold2); outline-offset: 0; border-color: var(--gold2); }
button, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 18px; border-radius: 9px; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none; border: 0; }
.primary { background: linear-gradient(#e8c35a, #b8902f); color: var(--ink); }
.primary:hover { filter: brightness(1.08); }
button:disabled { opacity: .6; cursor: default; }
.ghost { color: var(--text); border: 1px solid var(--line); background: rgba(58,45,30,.4); }
.ghost:hover { border-color: var(--gold2); }
.danger { color: #f6c0b8; border: 1px solid rgba(240,138,126,.5); background: rgba(163,58,50,.18); }
.danger:hover { border-color: #f08a7e; }
.small { padding: 6px 12px; font-size: 13px; }
.tiny { padding: 2px 8px; font-size: 12px; font-weight: 600; border-radius: 6px; }
.msg { min-height: 0; margin-top: 10px; font-size: 14px; color: #f08a7e; }
.msg:empty { display: none; }
.hint { font-size: 13px; color: var(--dim); }
.hidden { display: none !important; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.empty { color: var(--dim); text-align: center; padding: 24px; border: 1px dashed var(--line); border-radius: 12px; }
.panel { border: 1px solid var(--line); border-radius: 12px; background: linear-gradient(180deg, var(--panel), #241b12); padding: 16px 18px; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
.badge.reg { color: #9fd3ff; border-color: rgba(120,180,240,.5); }
.badge.run { color: #8fd69a; border-color: rgba(79,154,90,.7); }
.badge.done { color: var(--gold); border-color: var(--gold2); }
.badge.cancel { color: #f08a7e; border-color: rgba(240,138,126,.5); }

/* list */
.sect { margin: 28px 0 10px; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); font-weight: 700; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.card { display: block; text-decoration: none; color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
  background: linear-gradient(180deg, var(--panel), #241b12); }
.card:hover { border-color: var(--gold2); }
.card b { font-size: 17px; overflow-wrap: anywhere; }
.card .meta { font-size: 13px; color: var(--dim); margin-top: 6px; }
.card .champ { color: var(--gold); font-weight: 600; font-size: 14px; margin-top: 6px; }
.invites { display: grid; gap: 8px; margin: 18px 0 0; }
.invite { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border: 1px solid var(--gold2); background: rgba(232,195,90,.08); border-radius: 10px; padding: 10px 14px; font-size: 14px; }

/* detail */
.info { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); margin: 8px 0 20px; }
.info div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--bg2); }
.info small { display: block; color: var(--dim); font-size: 12px; }
.info b { font-weight: 600; overflow-wrap: anywhere; }
.plan { width: 100%; border-collapse: collapse; font-size: 14px; }
.plan th { text-align: left; color: var(--dim); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.plan td { padding: 6px 8px; border-bottom: 1px solid rgba(90,71,40,.4); }
.champion { margin: 0 0 20px; padding: 16px 18px; border-radius: 12px; border: 1px solid var(--gold); background: radial-gradient(ellipse at top, rgba(232,195,90,.2), rgba(232,195,90,.04));
  font-family: var(--serif); font-size: 22px; font-weight: 700; color: var(--gold); text-align: center; overflow-wrap: anywhere; }
.champion small { display: block; font-family: var(--sans); font-size: 14px; color: var(--dim); font-weight: 500; }
.x { background: none; border: 0; color: var(--dim); padding: 0 4px; font-size: 16px; line-height: 1; cursor: pointer; }
.x:hover { color: #f08a7e; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

/* bracket: two halves meeting at the final in the middle (drawBracket) */
.bscroll { overflow-x: auto; margin: 0 calc(50% - 50vw); padding: 0 20px 10px; scrollbar-color: var(--line) transparent; }
.bracket { display: flex; gap: 32px; width: max-content; margin: 0 auto; align-items: stretch; }
.bcol { display: flex; flex-direction: column; width: 230px; flex: none; }
.bcol .rh { height: 64px; text-align: center; }
.bcol .rh b { display: block; font-family: var(--serif); font-size: 17px; color: var(--gold); line-height: 1.3; }
.bcol .rh small { display: block; color: var(--dim); font-size: 12px; line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bcol .ms { flex: 1; display: flex; flex-direction: column; }
.bcol .m { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; padding: 22px 0; }
/* connectors: a pair of series joins halfway to the next round, the last series of a half runs into the final */
.bcol.l .m::after, .bcol.r .m::after, .bcol.in .m::before { content: ""; position: absolute; width: 16px; border: 0 solid var(--gold2); }
.bcol.l .m::after { right: -16px; border-right-width: 2px; }
.bcol.r .m::after { left: -16px; border-left-width: 2px; }
.bcol .m:nth-child(odd)::after { top: 50%; height: 50%; border-top-width: 2px; }
.bcol .m:nth-child(even)::after { top: 0; height: 50%; border-bottom-width: 2px; }
.bcol.l .m:only-child::after, .bcol.r .m:only-child::after { top: 50%; height: 0; width: 32px; border-width: 2px 0 0; }
.bcol.l .m:only-child::after { right: -32px; }
.bcol.r .m:only-child::after { left: -32px; }
.bcol.in .m::before { top: 50%; border-top-width: 2px; }
.bcol.l.in .m::before { left: -16px; }
.bcol.r.in .m::before { right: -16px; }
.fin .cup { height: 74px; margin-bottom: 14px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
  border: 1px solid var(--gold2); border-radius: 10px; background: radial-gradient(ellipse at top, rgba(232,195,90,.22), rgba(232,195,90,.04)); padding: 0 10px; }
.fin .cup b { font-family: var(--serif); color: var(--gold); font-size: 17px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fin .cup small { color: var(--dim); font-size: 12px; }
.fin .sp { height: 88px; }
.series { position: relative; display: grid; gap: 4px; border-radius: 6px; outline-offset: 4px; }
.series[data-s] { cursor: pointer; }
.series[data-s]:hover, .series.open { outline: 1px solid var(--gold2); }
.series.play { outline: 1px solid rgba(79,154,90,.8); }
.series .st { position: absolute; top: 100%; left: 0; right: 0; margin-top: 3px; font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.series .st.live { color: #8fd69a; }
.series .st.bad { color: #f08a7e; }
/* a team: a gold bar (name, score or seats taken), its seats below while registering */
.tb { display: flex; align-items: stretch; gap: 4px; height: 30px; font-size: 13px; font-weight: 700; }
.bcol.r .tb { flex-direction: row-reverse; }
.tb .n { flex: 1; min-width: 0; line-height: 30px; padding: 0 10px; border-radius: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  text-transform: uppercase; color: var(--ink); background: linear-gradient(#f5e2a6, #d6b45e); }
.tb .w { flex: none; min-width: 32px; padding: 0 4px; display: grid; place-items: center; border-radius: 3px; border: 1px solid var(--gold2); background: #0e0b07;
  color: var(--gold); font-weight: 800; font-variant-numeric: tabular-nums; }
.tb .w.ok { color: #8fd69a; border-color: rgba(79,154,90,.8); }
.tb.win .w { background: var(--gold); color: var(--ink); }
.tb.lose .n { background: linear-gradient(#8f7f58, #6f6142); color: #2b2217; }
.tb.lose .w { color: var(--dim); border-color: var(--line); }
.tb.none .n { background: rgba(14,11,7,.5); border: 1px dashed var(--line); color: var(--dim); font-weight: 500; font-style: italic; text-transform: none; line-height: 28px; }
.tb.mine .n { box-shadow: 0 0 0 2px var(--gold); }
.tb .x { flex: none; }
.mem { font-size: 11px; color: var(--dim); margin: -2px 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bcol.r .mem { text-align: right; }
.table + .table { margin-top: 6px; }
.table > .seat { height: 30px; font-size: 13px; }
.seats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 4px; }
.seat { display: flex; align-items: center; gap: 5px; height: 28px; min-width: 0; padding: 0 4px 0 5px; border-radius: 6px; font-size: 12px;
  border: 1px solid rgba(90,71,40,.9); background: rgba(14,11,7,.6); }
.seat .av { flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 800;
  background: var(--panel2); color: var(--gold); }
.seat .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat.wait { color: var(--dim); font-style: italic; }
.seat.me { border-color: var(--gold); background: rgba(232,195,90,.1); }
.seat.free { border-style: dashed; color: var(--dim); padding: 0; }
.seat.free > span { display: flex; align-items: center; gap: 5px; padding: 0 5px; }
.seat.free .av { background: none; border: 1px dashed currentColor; color: inherit; }
.seat .sit { flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; gap: 5px; padding: 0 5px; border: 0; border-radius: 5px; background: none;
  color: var(--gold); font: inherit; font-size: 12px; font-weight: 600; justify-content: flex-start; cursor: pointer; }
.seat .sit:hover { background: rgba(232,195,90,.12); }
.seat .sit .av { border-style: solid; }
.seat .inv { flex: none; height: 22px; margin-right: 3px; padding: 0 6px; border-radius: 5px; border: 1px solid var(--line); background: none; color: var(--dim); font: inherit; font-size: 11px; cursor: pointer; }
.seat .inv:hover { color: var(--gold); border-color: var(--gold2); }
.sdetail { margin-top: 18px; }
.games { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-size: 14px; }
.games li { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 10px; border: 1px solid rgba(90,71,40,.6); border-radius: 8px; background: var(--bg2); }
.games li.void { opacity: .7; }
.games li.void .res { text-decoration: line-through; }
.games .res { font-weight: 600; }
.games .res b { color: #8fd69a; }
.games .tag { font-size: 12px; color: var(--dim); }
.games .tag.v { color: #f08a7e; }
.rules { margin: 36px 0 48px; padding: 20px 22px; border: 1px solid rgba(184,144,47,.35); border-radius: 14px; background: var(--bg2); }
.rules h2 { font-size: 20px; margin-bottom: 8px; }
.rules ol, .rules ul { margin: 0; padding-left: 20px; color: var(--dim); }
.rules li { margin: 4px 0; }
.rules b { color: var(--text); }

dialog { border: 1px solid rgba(184,144,47,.5); border-radius: 14px; padding: 24px; width: min(420px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
  background: linear-gradient(180deg, var(--panel), #241b12); color: var(--text); }
dialog.wide { width: min(640px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0,0,0,.65); }
dialog .close { position: absolute; top: 10px; right: 10px; background: none; color: var(--dim); font-size: 22px; padding: 4px 10px; }
dialog form > button[type=submit] { margin-top: 18px; width: 100%; }
dialog h2 { margin-bottom: 4px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.choice { display: flex; gap: 6px; flex-wrap: wrap; }
.choice label { margin: 0; }
.choice input { display: none; }
.choice span { display: inline-block; padding: 7px 13px; border: 1px solid var(--line); border-radius: 8px; color: var(--text); cursor: pointer; font-size: 14px; font-weight: 600; background: #0e0b07; }
.choice input:checked + span { background: linear-gradient(#e8c35a, #b8902f); color: var(--ink); border-color: transparent; }
.choice input:focus-visible + span { outline: 2px solid var(--gold2); }
.plan select, .plan input { padding: 6px 8px; font-size: 14px; }
.plan input { width: 90px; }
/* round robin: the table, then every pairing (renderLeague) */
.standings td:nth-child(n+3), .standings th:nth-child(n+3) { text-align: center; }
.standings td.pts { font-weight: 700; color: var(--gold); }
.standings tr.top td { background: rgba(232,195,90,.08); }
.standings tr.mine td:nth-child(2) { color: var(--gold); }
.lgrid { display: grid; gap: 30px 16px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); margin: 8px 0 34px; }
.lgrid > .table + .table { margin-top: 0; }
@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .who .name, .links { display: none; }
  .two { grid-template-columns: 1fr; }
  .bscroll { padding: 0 16px 10px; }
  .bcol { width: 214px; }
}
</style>
<link rel="stylesheet" href="/modern.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/"><img src="/favicon.svg" alt="" width="30" height="36">SuperAqE</a>
    <nav class="links" aria-label="Trang"><a href="/giai-dau/" class="on">Giải đấu</a><a href="/lich-su-tran/">Lịch sử trận</a><a href="/tai-khoan/">Tài khoản</a></nav>
    <div class="who">
      <span class="hidden" id="who"><span class="name"><a href="/tai-khoan/"><b id="whoName"></b></a> · </span><button class="ghost small" id="btnLogout">Đăng xuất</button></span>
      <button class="primary small hidden" id="btnLogin">Đăng nhập</button>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<dialog id="loginDlg" aria-labelledby="loginTitle">
  <button class="close" type="button" data-close aria-label="Đóng">×</button>
  <h2 id="loginTitle">Đăng nhập</h2>
  <p class="hint" style="margin:0" id="loginWhy">Đăng nhập bằng tài khoản SuperAqE.</p>
  <form id="loginForm">
    <label for="lu">Tên đăng nhập</label>
    <input id="lu" autocomplete="username" required maxlength="24">
    <label for="lp">Mật khẩu</label>
    <input id="lp" type="password" autocomplete="current-password" required maxlength="128">
    <button class="primary" type="submit">Đăng nhập</button>
    <div class="msg" id="loginMsg"></div>
  </form>
  <p class="hint">Chưa có tài khoản? <a href="/#tai-ve">Tải SuperAqE</a> và đăng ký ngay trong launcher. Đăng nhập trên web không làm launcher của bạn bị đăng xuất.</p>
</dialog>

<dialog id="createDlg" class="wide" aria-labelledby="createTitle">
  <button class="close" type="button" data-close aria-label="Đóng">×</button>
  <h2 id="createTitle">Tạo giải đấu</h2>
  <form id="createForm">
    <label for="cName">Tên giải</label>
    <input id="cName" required minlength="3" maxlength="60" placeholder="Ví dụ: Giải Đế Chế mùa đông 2026">
    <label for="cDesc">Giới thiệu, luật riêng, giải thưởng (không bắt buộc)</label>
    <textarea id="cDesc" maxlength="1000" rows="3"></textarea>
    <label>Thể thức</label>
    <div class="choice">
      <label><input type="radio" name="format" value="elim" checked><span>Loại trực tiếp</span></label>
      <label><input type="radio" name="format" value="rr"><span>Vòng tròn tính điểm</span></label>
    </div>
    <p class="hint" id="cFormatHint" style="margin:6px 0 0"></p>
    <div class="two">
      <div>
        <label>Thành viên mỗi đội</label>
        <div class="choice" id="cSize"></div>
      </div>
      <div>
        <label>Tổng số đội</label>
        <div class="choice" id="cCap"></div>
      </div>
    </div>
    <label>Cách vào giải</label>
    <div class="choice">
      <label><input type="radio" name="mode" value="open" checked><span>Tự tham gia</span></label>
      <label><input type="radio" name="mode" value="invite"><span>Chỉ người được mời</span></label>
    </div>
    <p class="hint" id="cModeHint" style="margin:6px 0 0"></p>
    <label for="cStart">Giờ bắt đầu (hết hạn đăng ký, bốc thăm ngẫu nhiên)</label>
    <input id="cStart" type="datetime-local" required>
    <label>Lộ trình thi đấu</label>
    <table class="plan"><thead><tr><th id="cPlanHead">Vòng</th><th>Số trận</th><th>Thời gian</th><th>Hạn chót</th></tr></thead><tbody id="cPlan"></tbody></table>
    <p class="hint" id="cPlanHint" style="margin:6px 0 0"></p>
    <button class="primary" type="submit">Tạo giải</button>
    <div class="msg" id="createMsg"></div>
  </form>
</dialog>

<dialog id="askDlg" aria-labelledby="askTitle">
  <button class="close" type="button" data-close aria-label="Đóng">×</button>
  <h2 id="askTitle"></h2>
  <p class="hint" style="margin:0" id="askHint"></p>
  <form id="askForm">
    <label for="askInput" id="askLabel"></label>
    <input id="askInput" required>
    <button class="primary" type="submit" id="askBtn"></button>
    <div class="msg" id="askMsg"></div>
  </form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const CUP = '<svg class="i-cup" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0z"/><path d="M17 5h3v2a3 3 0 01-3 3M7 5H4v2a3 3 0 003 3"/></svg>';
const H = 3600_000;
let me = null, isAdmin = false, pending = null;
const tourId = Number(new URLSearchParams(location.search).get("id")) || 0;

async function api(path, body, prefix = "/api/web/") {
  const res = await fetch(prefix + path, body === undefined ? { credentials: "same-origin" }
    : { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || "Có lỗi, hãy thử lại."), { status: res.status });
  return data;
}

function setMe(info) {
  me = info;
  $("who").classList.toggle("hidden", !me);
  $("btnLogin").classList.toggle("hidden", !!me);
  if (me) $("whoName").textContent = me.username;
}
function askLogin(then, why) {
  pending = then ?? null;
  $("loginWhy").textContent = why ?? "Đăng nhập bằng tài khoản SuperAqE.";
  $("loginMsg").textContent = "";
  $("loginDlg").showModal();
  $("lu").focus();
}
const same = (a, b) => String(a ?? "").toLowerCase() === String(b ?? "").toLowerCase();

const fmtTime = (t) => new Date(t).toLocaleString("vi-VN", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
function fmtLeft(ms) {
  if (ms <= 0) return "hết giờ";
  const m = Math.ceil(ms / 60000);
  if (m < 60) return `${m} phút`;
  const h = Math.floor(m / 60);
  return h < 48 ? `${h} giờ ${m % 60 ? (m % 60) + " phút" : ""}`.trim() : `${Math.floor(h / 24)} ngày ${h % 24} giờ`;
}
const fmtDur = (ms) => ms ? `${Math.round(ms / 60000)} phút` : "";
const bo = (wins) => wins === 1 ? "1 trận (BO1)" : `Chạm ${wins} (BO${wins * 2 - 1})`;
const roundName = (r, total) => ["Chung kết", "Bán kết", "Tứ kết", "Vòng 1/8"][total - 1 - r] ?? `Vòng ${r + 1}`;
const fmtSize = (n) => `${n}-${n}`;
const FORMAT = { elim: "loại trực tiếp", rr: "vòng tròn tính điểm" };
const isRR = (t) => t.format === "rr";
const STATUS = { reg: "Đang nhận đăng ký", run: "Đang thi đấu", done: "Đã kết thúc", cancel: "Đã huỷ" };
const badge = (s) => `<span class="badge ${s}">${STATUS[s] ?? s}</span>`;
const MODE = { open: "Tự tham gia", invite: "Chỉ người được mời" };
const flash = (el, text) => { el.textContent = text; };

// ---------------- list
async function showList() {
  document.title = "Giải đấu Đế Chế – SuperAqE";
  const main = $("main");
  main.innerHTML = `
    <div class="row" style="align-items:flex-end">
      <div class="grow"><h1>Giải đấu</h1>
      <p class="sub" style="margin-bottom:0">Tổ chức giải Đế Chế online cho bạn bè, hội nhóm: 1-1, 2-2, 3-3 hoặc 4-4, chia nhánh loại trực tiếp hoặc đá vòng tròn tính điểm, chạm 2 hay chạm 3 tuỳ vòng. Kết quả hệ thống tự lấy từ trận đấu trên SuperAqE và công khai cho mọi người xem.</p></div>
      <button class="primary" id="btnCreate">+ Tạo giải đấu</button>
    </div>
    <div class="invites" id="invites"></div>
    <div id="lists"><p class="hint" style="margin-top:24px">Đang tải…</p></div>
    ${rulesHtml()}`;
  $("btnCreate").onclick = () => me ? openCreate() : askLogin(openCreate, "Đăng nhập để tạo giải đấu.");
  try {
    const { tours, invites } = await api("tours");
    $("invites").innerHTML = invites.map((i) => `<div class="invite"><span class="grow">Bạn được mời vào đội <b>${esc(i.team)}</b> của giải <b>${esc(i.name)}</b></span>
      <a class="btn primary small" href="?id=${i.tid}">Xem và trả lời</a></div>`).join("");
    const groups = [["run", "Đang thi đấu"], ["reg", "Đang nhận đăng ký"], ["end", "Đã kết thúc"]];
    const html = groups.map(([key, title]) => {
      const items = tours.filter((t) => key === "end" ? ["done", "cancel"].includes(t.status) : t.status === key);
      if (!items.length) return "";
      return `<div class="sect">${title}</div><div class="cards">${items.map(card).join("")}</div>`;
    }).join("");
    $("lists").innerHTML = html || `<div class="empty" style="margin-top:24px">Chưa có giải đấu nào. Hãy là người đầu tiên tạo giải!</div>`;
  } catch (e) {
    $("lists").innerHTML = `<div class="empty" style="margin-top:24px">${esc(e.message)}</div>`;
  }
}
function card(t) {
  const plan = t.rounds ?? t.plan;
  const wins = [...new Set(plan.map((r) => r.wins))];
  const when = t.status === "reg" ? `Bắt đầu ${fmtTime(t.startAt)}` : t.status === "run" ? `Bắt đầu ${fmtTime(t.startedAt)}` : t.finishedAt ? `Kết thúc ${fmtTime(t.finishedAt)}` : "";
  return `<a class="card" href="?id=${t.id}">
    <div class="row"><b class="grow">${esc(t.name)}</b>${badge(t.status)}</div>
    <div class="meta">${fmtSize(t.teamSize)} · ${isRR(t) ? "Vòng tròn" : "Loại trực tiếp"} · ${t.teams}/${t.capacity} đội · ${wins.length === 1 ? bo(wins[0]) : "Chạm " + wins.join("/")} · ${MODE[t.mode]}</div>
    <div class="meta">Tổ chức: ${esc(t.organizer)} · ${when}</div>
    ${t.championName ? `<div class="champ">${CUP}Vô địch: ${esc(t.championName)}</div>` : ""}
  </a>`;
}

// ---------------- create
function openCreate() {
  const size = $("cSize"), cap = $("cCap");
  if (!size.children.length) {
    size.innerHTML = [1, 2, 3, 4].map((n) => `<label><input type="radio" name="size" value="${n}" ${n === 1 ? "checked" : ""}><span>${fmtSize(n)}</span></label>`).join("");
    const start = new Date(Date.now() + 24 * H);
    start.setMinutes(0, 0, 0);
    $("cStart").value = new Date(start - start.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    $("createForm").addEventListener("change", (e) => {
      if (e.target.name === "format") buildCaps();
      if (e.target.name === "cap" || e.target.name === "format") buildPlan(); else planDeadlines();
      modeHint();
    });
    $("createForm").addEventListener("input", planDeadlines);
    buildCaps();
    buildPlan();
    modeHint();
  }
  $("createMsg").textContent = "";
  $("createDlg").showModal();
}
const formVal = (name) => $("createForm").querySelector(`input[name=${name}]:checked`)?.value;
function modeHint() {
  const size = Number(formVal("size"));
  $("cModeHint").textContent = formVal("mode") === "invite"
    ? (size === 1 ? "Bạn mời từng người chơi; mỗi người là một đội, họ bấm chấp nhận trên trang giải." : "Bạn tạo các đội và mời người vào từng đội; người được mời bấm chấp nhận trên trang giải.")
    : (size === 1 ? "Ai có tài khoản SuperAqE cũng bấm Tham gia được, đến khi đủ số đội." : "Người chơi tự tạo đội (làm đội trưởng, mời đồng đội) hoặc vào đội còn chỗ, đến khi đủ số đội.");
}
// The team counts of the format chosen (a bracket doubles, a round robin takes any small count).
function buildCaps() {
  const rr = formVal("format") === "rr", was = Number(formVal("cap"));
  const caps = rr ? [3, 4, 5, 6, 8, 10] : [2, 4, 8, 16];
  const pick = caps.includes(was) ? was : rr ? 4 : 8;
  $("cCap").innerHTML = caps.map((n) => `<label><input type="radio" name="cap" value="${n}" ${n === pick ? "checked" : ""}><span>${n} đội</span></label>`).join("");
  $("cFormatHint").textContent = rr
    ? "Mỗi đội gặp tất cả các đội khác một lần. Thắng 3 điểm, hoà 1 điểm, thua hoặc bỏ trận 0 điểm; đội nhiều điểm nhất vô địch."
    : "Chia nhánh, thua là bị loại; đội thắng chung kết vô địch.";
}
function buildPlan() {
  const rr = formVal("format") === "rr", cap = Number(formVal("cap"));
  const wins = (def) => `<select data-wins>${[1, 2, 3, 4, 5].map((w) => `<option value="${w}" ${w === def ? "selected" : ""}>${bo(w)}</option>`).join("")}</select>`;
  $("cPlanHead").textContent = rr ? "Mỗi cặp" : "Vòng";
  if (rr) {
    // No fixtures: one row, the time the whole league lasts.
    $("cPlan").innerHTML = `<tr><td>${cap * (cap - 1) / 2} cặp</td><td>${wins(1)}</td>
      <td><input data-hours type="number" min="1" max="720" value="168"> giờ cho cả giải</td><td class="hint" data-deadline></td></tr>`;
    $("cPlanHint").innerHTML = "Không xếp lịch: hai đội gặp nhau lúc nào cũng được, kết quả tự vào bảng điểm. Hết hạn chót: đội đang dẫn thắng cặp đó, bằng nhau thì hoà, chưa đánh trận nào thì <b>cả hai 0 điểm</b>.";
  } else {
    const rounds = Math.log2(cap);
    $("cPlan").innerHTML = Array.from({ length: rounds }, (_, r) => `<tr>
      <td>${roundName(r, rounds)}</td>
      <td>${wins(r === rounds - 1 ? 3 : 2)}</td>
      <td><input data-hours type="number" min="1" max="720" value="${r === rounds - 1 ? 72 : 48}"> giờ</td>
      <td class="hint" data-deadline></td></tr>`).join("");
    $("cPlanHint").innerHTML = "Mỗi nhánh phải xong trong thời gian của vòng. Hết giờ mà chưa đủ số trận thắng thì <b>cả hai đội đều bị loại</b>.";
  }
  planDeadlines();
}
function planDeadlines() {
  let t = new Date($("cStart").value).getTime();
  for (const tr of $("cPlan").children) {
    t += (Number(tr.querySelector("[data-hours]").value) || 0) * H;
    tr.querySelector("[data-deadline]").textContent = Number.isFinite(t) ? fmtTime(t) : "";
  }
}
$("createForm").onsubmit = async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector("button[type=submit]");
  btn.disabled = true;
  $("createMsg").textContent = "";
  try {
    const rounds = [...$("cPlan").children].map((tr) => ({ wins: Number(tr.querySelector("[data-wins]").value), hours: Number(tr.querySelector("[data-hours]").value) }));
    const { id } = await api("tour/create", { name: $("cName").value, desc: $("cDesc").value, format: formVal("format"), teamSize: Number(formVal("size")),
      capacity: Number(formVal("cap")), mode: formVal("mode"), rounds, startAt: new Date($("cStart").value).getTime() });
    location.href = "?id=" + id;
  } catch (err) {
    if (err.status === 401) { setMe(null); $("createDlg").close(); askLogin(openCreate, "Phiên đăng nhập đã hết, hãy đăng nhập lại."); }
    else $("createMsg").textContent = err.message;
  } finally {
    btn.disabled = false;
  }
};

// ---------------- detail
let D = null, openSeries = null, poll = null, busy = false;
async function showTour() {
  try {
    D = await api("tour?id=" + tourId);
  } catch (e) {
    $("main").innerHTML = `<h1>Giải đấu</h1><div class="empty">${esc(e.message)}</div><p><a href="/giai-dau/">← Tất cả giải đấu</a></p>`;
    return;
  }
  renderTour();
}
// While registering, seats fill up as other players sit down: reload now and then (not while a dialog is open).
function schedulePoll() {
  clearTimeout(poll);
  if (D?.tour.status !== "reg") return;
  poll = setTimeout(async () => {
    if (!document.hidden && !document.querySelector("dialog[open]") && !busy) {
      try { D = await api("tour?id=" + tourId); renderTour(); return; } catch {}
    }
    schedulePoll();
  }, 30_000);
}
// done: called once the change went through (closes the dialog it came from).
async function act(op, body, msgEl, done) {
  if (!me) return askLogin(() => act(op, body, msgEl, done), "Đăng nhập để tiếp tục.");
  if (busy) return;
  busy = true;
  try {
    await api("tour/" + op, { id: tourId, ...body });
    done?.();
    await showTour();
  } catch (e) {
    if (e.status === 401) { setMe(null); askLogin(() => act(op, body, msgEl, done), "Phiên đăng nhập đã hết, hãy đăng nhập lại."); return; }
    if (msgEl) flash(msgEl, e.message); else alert(e.message);
  } finally {
    busy = false;
  }
}
// One-field dialog: a team name or a player to invite.
function ask({ title, hint = "", label, value = "", max, button, run }) {
  $("askTitle").textContent = title;
  $("askHint").textContent = hint;
  $("askLabel").textContent = label;
  $("askBtn").textContent = button;
  $("askMsg").textContent = "";
  const input = $("askInput");
  input.value = value;
  input.maxLength = max;
  $("askForm").onsubmit = (e) => {
    e.preventDefault();
    const v = input.value.trim();
    if (v) run(v, $("askMsg"), () => $("askDlg").close());
  };
  $("askDlg").showModal();
  input.select();
}
// Bracket slot order of seeds 1..n, as the Worker draws it (tournament.js seedOrder).
function seedOrder(n) {
  let order = [1];
  while (order.length < n) order = order.flatMap((s) => [s, order.length * 2 + 1 - s]);
  return order;
}
// rounds: [{head, series: [html]}], the final last. The first half of each round goes on the left, the
// second half on the right (mirrored), the final in the middle under the cup.
function drawBracket(rounds, cup) {
  const last = rounds.length - 1;
  const col = (r, side) => {
    const s = rounds[r].series, half = s.length / 2;
    return `<div class="bcol ${side} ${r ? "in" : ""}"><div class="rh">${rounds[r].head}</div>
      <div class="ms">${(side === "l" ? s.slice(0, half) : s.slice(half)).map((h) => `<div class="m">${h}</div>`).join("")}</div></div>`;
  };
  const sides = Array.from({ length: last }, (_, r) => r);
  return `<div class="bscroll"><div class="bracket">
    ${sides.map((r) => col(r, "l")).join("")}
    <div class="bcol"><div class="rh">${rounds[last].head}</div>
      <div class="ms"><div class="m"><div class="fin"><div class="cup">${cup}</div>${rounds[last].series[0]}<div class="sp"></div></div></div></div></div>
    ${sides.reverse().map((r) => col(r, "r")).join("")}
  </div></div>`;
}
const teamName = (id) => D.teams.find((t) => t.id === id)?.name ?? "?";
const membersOf = (id) => (D.teams.find((t) => t.id === id)?.members ?? []).filter((m) => m.state === "in").map((m) => m.username);

function renderTour() {
  const t = D.tour;
  document.title = `${t.name} – Giải đấu SuperAqE`;
  const rounds = t.rounds ?? t.plan;
  const scrollX = document.querySelector(".bscroll")?.scrollLeft;  // kept when the page reloads itself
  const myMember = me && D.teams.flatMap((x) => x.members.map((m) => ({ ...m, team: x.id }))).find((m) => same(m.username, me.username));
  const organizer = me && same(t.organizer, me.username);
  let deadline = t.startedAt ?? t.startAt;
  const planRows = rounds.map((r, i) => {
    deadline += r.hours * H;
    return `<tr><td>${isRR(t) ? "Cả giải" : roundName(i, rounds.length)}</td><td>${bo(r.wins)}</td><td>${r.hours} giờ</td><td>${t.status === "reg" ? "dự kiến " : ""}${fmtTime(deadline)}</td></tr>`;
  }).join("");
  const planHint = isRR(t)
    ? "Không xếp lịch: hai đội gặp nhau lúc nào cũng được, từ khi giải bắt đầu đến hạn chót. Hết hạn: đội đang dẫn thắng cặp đó, bằng nhau thì hoà, chưa đánh thì cả hai 0 điểm."
    : `Nhánh chưa xong khi hết hạn chót: cả hai đội bị loại, đối thủ ở vòng sau được đi tiếp.${t.status === "reg" && t.capacity > 2 ? " Nếu khi bắt đầu chưa đủ đội, nhánh thu gọn lại và dùng các vòng cuối của lộ trình." : ""}`;
  const champ = t.status === "done" ? (t.champion
    ? `<div class="champion">${CUP}${esc(teamName(t.champion))}<small>Vô địch${t.teamSize > 1 ? " · " + membersOf(t.champion).map(esc).join(", ") : ""}</small></div>`
    : `<div class="champion" style="color:var(--dim)">Không có nhà vô địch<small>${isRR(t) ? "Không đội nào ghi được điểm." : "Trận chung kết không kết thúc đúng hạn: cả hai đội bị loại."}</small></div>`) : "";
  $("main").innerHTML = `
    <p style="margin:20px 0 0"><a href="/giai-dau/">← Tất cả giải đấu</a></p>
    <div class="row" style="align-items:baseline"><h1 class="grow">${esc(t.name)}</h1>${badge(t.status)}</div>
    ${t.desc ? `<p class="sub">${esc(t.desc)}</p>` : ""}
    ${t.status === "cancel" ? `<div class="empty" style="margin-bottom:20px">${esc(t.note ?? "Giải đã bị huỷ.")}</div>` : ""}
    ${champ}
    <div class="info">
      <div><small>Thể thức</small><b>${fmtSize(t.teamSize)} · ${FORMAT[t.format] ?? FORMAT.elim}</b></div>
      <div><small>Số đội</small><b>${D.teams.length} / ${t.capacity}</b></div>
      <div><small>Cách vào giải</small><b>${MODE[t.mode]}</b></div>
      <div><small>Người tổ chức</small><b>${esc(t.organizer)}</b></div>
      <div><small>${t.startedAt ? "Đã bắt đầu" : "Bắt đầu"}</small><b>${fmtTime(t.startedAt ?? t.startAt)}</b>${t.status === "reg" ? `<small>còn ${fmtLeft(t.startAt - D.now)}</small>` : ""}</div>
    </div>
    <div class="panel"><h3>Lộ trình thi đấu</h3><div style="overflow-x:auto"><table class="plan"><thead><tr><th>${isRR(t) ? "" : "Vòng"}</th><th>Số trận</th><th>Thời gian</th><th>Hạn chót</th></tr></thead><tbody>${planRows}</tbody></table></div>
      <p class="hint" style="margin:8px 0 0">${planHint}</p></div>
    <div id="body" style="margin-top:24px"></div>
    ${rulesHtml(t)}`;
  if (t.status === "reg") renderRegistration(myMember, organizer);
  else if (D.bracket) isRR(t) ? renderLeague() : renderBracket();
  const box = document.querySelector(".bscroll");
  if (box && scrollX) box.scrollLeft = scrollX;
  schedulePoll();
}

// Registration: the bracket is drawn already, each team a table ("bàn") with one seat per player.
// Tables are only places to sit: the pairings are drawn at random when the tournament starts.
function renderRegistration(my, organizer) {
  const t = D.tour;
  const body = $("body");
  const solo = t.teamSize === 1;
  const captainOf = (team) => me && same(team.captain, me.username);
  const canInvite = (team) => organizer || (t.mode === "open" && captainOf(team));
  const canSit = !my && t.mode === "open";
  const inCount = (x) => x.members.filter((m) => m.state === "in").length;
  const ready = D.teams.filter((x) => inCount(x) === t.teamSize).length;
  const av = (name) => `<span class="av">${esc(name.slice(0, 1).toUpperCase())}</span>`;
  // A free seat: what a click does depends on who looks.
  const freeSeat = (x) => {
    const button = (attr, label, extra = "") => `<div class="seat free"><button class="sit" ${attr}><span class="av">+</span><span class="n">${label}</span></button>${extra}</div>`;
    const plain = (label) => `<div class="seat free"><span>${av("")}<span class="n">${label}</span></span></div>`;
    if (!x) {
      if (canSit) return button("data-sit", "Ngồi vào");
      if (organizer && t.mode === "invite") return solo ? button("data-invitesolo", "Mời người chơi") : button("data-addteam", "Thêm đội");
      return plain("Ghế trống");
    }
    const invite = canInvite(x);
    if (canSit) return button(`data-jointeam="${x.id}"`, "Ngồi vào", invite ? `<button class="inv" data-invite="${x.id}" title="Mời người chơi vào ghế này">Mời</button>` : "");
    if (invite) return button(`data-invite="${x.id}"`, "Mời bạn");
    return plain("Ghế trống");
  };
  const seat = (x, m) => {
    const self = me && same(m.username, me.username);
    const x_ = self ? (m.state === "in" ? `<button class="x" title="Rời ghế" data-leave>×</button>` : "")
      : organizer || captainOf(x) ? `<button class="x" title="Loại khỏi đội" data-kick="${esc(m.username)}">×</button>` : "";
    const name = `${!solo && same(m.username, x.captain) ? "★ " : ""}${m.username}${m.state === "in" ? "" : " (chờ nhận lời)"}`;
    return `<div class="seat ${m.state === "in" ? "" : "wait"} ${self ? "me" : ""}" title="${esc(name)}">${av(m.username)}<span class="n">${esc(name)}</span>${x_}</div>`;
  };
  // 1-1: the bar is the seat. Teams: the bar is the table (name, seats taken), its seats below.
  const table = (x) => {
    const mine = my && x && my.team === x.id;
    if (solo) return `<div class="table">${x ? seat(x, x.members[0] ?? { username: x.name, state: "in" }) : freeSeat(null)}</div>`;
    const n = x ? inCount(x) : 0;
    const bar = x
      ? `<div class="tb ${mine ? "mine" : ""}"><span class="n" title="${esc(x.name)}">${esc(x.name)}</span>${organizer ? `<button class="x" title="Xoá đội" data-delteam="${x.id}">×</button>` : ""}<span class="w ${n === t.teamSize ? "ok" : ""}" title="Số người đã vào">${n}/${t.teamSize}</span></div>`
      : `<div class="tb none"><span class="n">Bàn trống</span></div>`;
    const seats = x ? [...x.members.map((m) => seat(x, m)), ...Array.from({ length: t.teamSize - x.members.length }, () => freeSeat(x))]
      : Array.from({ length: t.teamSize }, () => freeSeat(null));
    return `<div class="table">${bar}<div class="seats">${seats.join("")}</div></div>`;
  };
  // Teams fill the tables in seed order, so the first ones to register sit in different halves.
  const tables = Array(t.capacity).fill(null);
  seedOrder(t.capacity).forEach((seed, slot) => { tables[slot] = D.teams[seed - 1] ?? null; });
  const total = t.plan.length;
  let deadline = t.startAt;
  const rounds = t.plan.map((r, ri) => {
    deadline += r.hours * H;
    const wait = `<div class="series"><div class="tb none"><span class="n">Chờ đội thắng</span></div><div class="tb none"><span class="n">Chờ đội thắng</span></div></div>`;
    return { head: `<b>${roundName(ri, total)}</b><small>${bo(r.wins)}</small><small>hạn dự kiến ${fmtTime(deadline)}</small>`,
      series: Array.from({ length: t.capacity >> (ri + 1) }, (_, k) => ri ? wait : `<div class="series">${table(tables[2 * k])}${table(tables[2 * k + 1])}</div>`) };
  });
  const how = t.mode === "open"
    ? (solo ? "Bấm <b>Ngồi vào</b> ở một ghế trống để tham gia giải." : `Mỗi bàn là một đội ${t.teamSize} ghế. Bấm <b>Ngồi vào</b> ở bàn đã có đội để làm đồng đội, hoặc ở bàn trống để lập đội mới (bạn làm đội trưởng ★, đặt tên đội và mời bạn bè).`)
    : "Giải chỉ dành cho người được mời: người tổ chức xếp đội và mời người chơi vào từng ghế.";
  body.innerHTML = `
    ${my?.state === "invited" ? `<div class="invite" style="margin-bottom:16px"><span class="grow">Bạn được mời vào đội <b>${esc(teamName(my.team))}</b>.</span>
      <button class="primary small" id="btnAccept">Chấp nhận</button><button class="ghost small" id="btnDecline">Từ chối</button></div>` : ""}
    <div class="row"><h2 class="grow" style="margin:0">${isRR(t) ? "Các đội" : "Sơ đồ thi đấu"}</h2><span class="hint">${D.teams.length}/${t.capacity} đội · ${ready} đội đủ người</span></div>
    <p class="hint" style="margin:4px 0 14px">${how} ${isRR(t)
      ? "Không có lịch cố định: khi giải bắt đầu, các đội đủ người gặp nhau lúc nào cũng được. Đội chưa đủ người khi đó sẽ không được thi đấu."
      : "Vị trí bàn chỉ để xếp chỗ: cặp đấu được <b>bốc thăm ngẫu nhiên</b> lúc giải bắt đầu, đội chưa đủ người khi đó sẽ không được xếp nhánh."}</p>
    <div class="msg" id="regMsg" style="margin:0 0 10px"></div>
    ${isRR(t) ? `<div class="lgrid">${Array.from({ length: t.capacity }, (_, i) => table(D.teams[i] ?? null)).join("")}</div>`
      : drawBracket(rounds, `<b>${CUP}Vô địch</b><small>Đội thắng chung kết</small>`)}
    <div class="actions">
      ${my?.state === "in" ? `<button class="ghost" id="btnLeave">Rời giải</button>` : ""}
      ${!me ? `<button class="primary" id="btnSignin">Đăng nhập để tham gia</button>` : ""}
    </div>
    ${organizer ? `<div class="actions" style="border-top:1px solid var(--line);padding-top:16px">
      <button class="primary" id="btnStart">Bắt đầu ngay (${ready} đội)</button>
      <button class="danger" id="btnCancel">Huỷ giải</button>
      <span class="hint" style="align-self:center">Nếu không bấm, giải tự bắt đầu lúc ${fmtTime(t.startAt)}.</span></div>` : ""}`;
  const msg = $("regMsg");
  const on = (id, fn) => { if ($(id)) $(id).onclick = fn; };
  const all = (sel, fn) => body.querySelectorAll(sel).forEach((el) => el.onclick = () => fn(el));
  const leave = () => confirm("Rời khỏi giải này?") && act("leave", {}, msg);
  on("btnLeave", leave);
  on("btnAccept", () => act("respond", { accept: true }, msg));
  on("btnDecline", () => act("respond", { accept: false }, msg));
  on("btnSignin", () => askLogin(showTour, "Đăng nhập để tham gia giải."));
  on("btnStart", () => confirm(`Bắt đầu giải ngay? Các đội đủ người sẽ được ${isRR(t) ? "bốc thăm lịch thi đấu" : "chia nhánh ngẫu nhiên"}, sau đó không đổi đội được nữa.`) && act("start", {}, msg));
  on("btnCancel", () => confirm("Huỷ giải này? Không thể hoàn tác.") && act("cancel", {}, msg));
  const newTeam = () => ask({ title: "Lập đội mới", hint: "Bạn ngồi ghế đầu tiên và làm đội trưởng, sau đó mời đồng đội hoặc chờ người khác ngồi vào.",
    label: "Tên đội", value: `Đội ${me.username}`, max: 30, button: "Lập đội và ngồi vào", run: (name, m, done) => act("join", { name }, m, done) });
  all("[data-sit]", () => solo ? act("join", {}, msg) : me ? newTeam() : askLogin(newTeam, "Đăng nhập để ngồi vào bàn."));
  all("[data-jointeam]", (b) => act("join", { team: Number(b.dataset.jointeam) }, msg));
  all("[data-leave]", leave);
  all("[data-kick]", (b) => confirm(`Loại ${b.dataset.kick} khỏi đội?`) && act("kick", { other: b.dataset.kick }, msg));
  all("[data-delteam]", (b) => confirm(`Xoá đội ${teamName(Number(b.dataset.delteam))}?`) && act("delteam", { team: Number(b.dataset.delteam) }, msg));
  all("[data-invite]", (b) => ask({ title: `Mời vào ${teamName(Number(b.dataset.invite))}`, hint: "Người được mời bấm Chấp nhận trên trang giải này.",
    label: "Tên người chơi", max: 24, button: "Mời", run: (other, m, done) => act("invite", { team: Number(b.dataset.invite), other }, m, done) }));
  all("[data-invitesolo]", () => ask({ title: "Mời người chơi", hint: "Mỗi người là một đội; họ bấm Chấp nhận trên trang giải này.",
    label: "Tên người chơi", max: 24, button: "Mời", run: (other, m, done) => act("invite", { other }, m, done) }));
  all("[data-addteam]", () => ask({ title: "Thêm đội", hint: "Sau đó mời người chơi vào từng ghế của đội.",
    label: "Tên đội", max: 30, button: "Thêm đội", run: (name, m, done) => act("addteam", { name }, m, done) }));
}

function seriesStatus(s) {
  const left = s.deadline ? s.deadline - D.now : 0;
  switch (s.status) {
    case "wait": return ["Chờ đối thủ", ""];
    case "play": return [`Đang đấu · ${s.wa}-${s.wb} · còn ${fmtLeft(left)}`, "live"];
    case "late": return ["Hết giờ · chờ kết quả ván đang đấu", "bad"];
    case "done": return [`${teamName(s.winner)} thắng ${Math.max(s.wa, s.wb)}-${Math.min(s.wa, s.wb)}`, ""];
    case "draw": return [`Hoà ${s.wa}-${s.wb}`, ""];
    case "bye": return [s.round === 0 ? "Đi tiếp (không có đối thủ)" : "Đi tiếp (đối thủ bị loại)", ""];
    case "out": return [isRR(D.tour) ? "Hết giờ, không đấu: cả hai 0 điểm" : "Hết giờ: cả hai đội bị loại", "bad"];
    default: return ["—", ""];
  }
}
function renderBracket() {
  const b = D.bracket, t = D.tour;
  const total = b.rounds.length;
  const side = (s, team, wins) => {
    if (!team) return `<div class="tb none"><span class="n">${s.status === "wait" ? "Chờ đội thắng" : "—"}</span></div>`;
    const cls = s.winner ? (s.winner === team ? "win" : "lose") : s.status === "out" ? "lose" : "";
    const members = t.teamSize > 1 ? membersOf(team) : [];
    return `<div class="tb ${cls}"><span class="n" title="${esc([teamName(team), ...members].join(" · "))}">${esc(teamName(team))}</span>${s.readyAt ? `<span class="w">${wins}</span>` : ""}</div>
      ${members.length ? `<div class="mem">${members.map(esc).join(", ")}</div>` : ""}`;
  };
  const rounds = b.rounds.map((r, i) => ({
    head: `<b>${roundName(i, total)}</b><small>${bo(r.wins)}</small><small>hạn ${fmtTime(r.deadline)}</small>`,
    series: r.series.map((s) => {
      const [text, cls] = seriesStatus(s);
      return `<div class="series ${s.status} ${openSeries === `${s.round}-${s.idx}` ? "open" : ""}" tabindex="0" data-s="${s.round}-${s.idx}">
        ${side(s, s.a, s.wa)}${side(s, s.b, s.wb)}<div class="st ${cls}">${esc(text)}</div></div>`;
    }),
  }));
  const cup = t.status === "done"
    ? (t.champion ? `<b title="${esc(teamName(t.champion))}">${CUP}${esc(teamName(t.champion))}</b><small>Vô địch</small>` : `<b>Không có vô địch</b><small>Chung kết không xong đúng hạn</small>`)
    : `<b>${CUP}Vô địch</b><small>Đội thắng chung kết</small>`;
  const playing = new Set(b.rounds[0].series.flatMap((s) => [s.a, s.b]).filter(Boolean));
  const outside = D.teams.filter((x) => !playing.has(x.id));
  $("body").innerHTML = `
    <h2>Sơ đồ thi đấu</h2>
    <p class="hint" style="margin-top:-8px">Bấm vào một nhánh để xem từng ván, replay và kết quả.</p>
    ${drawBracket(rounds, cup)}
    <div class="sdetail panel hidden" id="sdetail"></div>
    ${outside.length ? `<p class="hint" style="margin-top:14px">Không được xếp nhánh (thiếu người khi bắt đầu): ${outside.map((x) => esc(x.name)).join(", ")}</p>` : ""}`;
  document.querySelectorAll(".series[data-s]").forEach((el) => {
    const open = () => { openSeries = el.dataset.s; renderBracket(); $("sdetail").scrollIntoView({ block: "nearest", behavior: "smooth" }); };
    el.onclick = open;
    el.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } };
  });
  if (openSeries) renderSeries(openSeries);
}

// Round robin: the table on top, then every pairing, the ones still to play first (the same series boxes as a bracket).
function renderLeague() {
  const b = D.bracket, t = D.tour;
  const mine = me && D.teams.find((x) => x.members.some((m) => m.state === "in" && same(m.username, me.username)))?.id;
  const side = (s, team, wins) => {
    const cls = s.winner ? (s.winner === team ? "win" : "lose") : s.status === "out" ? "lose" : "";
    const members = t.teamSize > 1 ? membersOf(team) : [];
    return `<div class="tb ${cls}"><span class="n" title="${esc([teamName(team), ...members].join(" · "))}">${esc(teamName(team))}</span><span class="w">${wins}</span></div>
      ${members.length ? `<div class="mem">${members.map(esc).join(", ")}</div>` : ""}`;
  };
  const rows = b.table.map((r, n) => `<tr class="${n === 0 && t.status === "done" && t.champion === r.team ? "top" : ""} ${r.team === mine ? "mine" : ""}">
    <td>${n + 1}</td><td>${t.status === "done" && t.champion === r.team ? CUP : ""}${esc(teamName(r.team))}${t.teamSize > 1 ? `<div class="hint">${membersOf(r.team).map(esc).join(", ")}</div>` : ""}</td>
    <td>${r.played}</td><td>${r.won}</td><td>${r.drawn}</td><td>${r.lost}</td><td>${r.gw}-${r.gl}</td><td>${r.gw - r.gl > 0 ? "+" : ""}${r.gw - r.gl}</td><td class="pts">${r.points}</td></tr>`).join("");
  const r = b.rounds[0], order = { play: 0, late: 1 };
  const pairs = `<div class="lgrid">${[...r.series].sort((x, y) => (order[x.status] ?? 2) - (order[y.status] ?? 2)).map((s) => {
      const [text, cls] = seriesStatus(s);
      return `<div class="series ${s.status} ${openSeries === `${s.round}-${s.idx}` ? "open" : ""}" tabindex="0" data-s="${s.round}-${s.idx}">
        ${side(s, s.a, s.wa)}${side(s, s.b, s.wb)}<div class="st ${cls}">${esc(text)}</div></div>`;
    }).join("")}</div>`;
  const outside = D.teams.filter((x) => !b.table.some((r) => r.team === x.id));
  $("body").innerHTML = `
    <h2>Bảng xếp hạng</h2>
    <div style="overflow-x:auto"><table class="plan standings"><thead><tr><th>#</th><th>Đội</th><th title="Số cặp đấu đã xong">Trận</th><th>Thắng</th><th>Hoà</th><th>Thua</th><th title="Số ván thắng - thua">Ván</th><th title="Hiệu số ván">HS</th><th>Điểm</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="hint" style="margin:8px 0 0">Thắng 3 điểm, hoà 1, thua hoặc bỏ trận 0. Bằng điểm: xếp theo hiệu số ván, số ván thắng, rồi kết quả đối đầu.</p>
    <h2 style="margin-top:28px">Các cặp đấu</h2>
    <p class="hint" style="margin-top:-8px">${bo(r.wins)} · hạn chót ${fmtTime(r.deadline)}${t.status === "run" ? ` (còn ${fmtLeft(r.deadline - D.now)})` : ""}. Không xếp lịch: hai đội vào phòng đánh với nhau lúc nào cũng được, kết quả tự vào bảng. Bấm vào một cặp để xem từng ván, replay và kết quả.</p>
    ${pairs}
    <div class="sdetail panel hidden" id="sdetail"></div>
    ${outside.length ? `<p class="hint" style="margin-top:14px">Không được thi đấu (thiếu người khi bắt đầu): ${outside.map((x) => esc(x.name)).join(", ")}</p>` : ""}`;
  document.querySelectorAll(".series[data-s]").forEach((el) => {
    const open = () => { openSeries = el.dataset.s; renderLeague(); $("sdetail").scrollIntoView({ block: "nearest", behavior: "smooth" }); };
    el.onclick = open;
    el.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } };
  });
  if (openSeries) renderSeries(openSeries);
}

function renderSeries(key) {
  const [r, i] = key.split("-").map(Number);
  const s = D.bracket.rounds[r]?.series[i];
  if (!s) return;
  const box = $("sdetail");
  box.classList.remove("hidden");
  const total = D.bracket.rounds.length;
  const [text] = seriesStatus(s);
  const redraw = () => isRR(D.tour) ? renderLeague() : renderBracket();
  const head = `<div class="row"><h3 class="grow" style="margin:0">${isRR(D.tour) ? "Vòng tròn" : roundName(r, total)} ·${s.a ? esc(teamName(s.a)) : "?"} vs ${s.b ? esc(teamName(s.b)) : "?"}</h3>
    <button class="x" id="sclose" aria-label="Đóng">×</button></div>
    <p class="hint" style="margin:4px 0 12px">${esc(text)}${s.readyAt ? ` · mở từ ${fmtTime(s.readyAt)} · hạn chót ${fmtTime(s.deadline)}` : ""} · cần ${s.need} trận thắng</p>`;
  let list = "";
  if (s.readyAt && s.a && s.b) {
    const howto = s.status === "play" || s.status === "late" ? `<p class="hint">Cách đấu: một người tạo phòng trong launcher SuperAqE. <b>${esc(teamName(s.a))}</b> ngồi bên trái (Quan Nhất–Tứ phẩm), <b>${esc(teamName(s.b))}</b> ngồi bên phải (Ngũ–Bát phẩm)${D.tour.teamSize > 1 ? ", đủ và đúng thành viên đã đăng ký" : ""}, không thêm người chơi khác (khán giả thì được). Trận dài từ 5 phút, đánh xong là kết quả tự hiện ở đây.</p>` : "";
    list = s.games.length ? `<ul class="games">${s.games.map((g, n) => {
      const m = D.matches[g.matchId] ?? {};
      return `<li class="${g.voided ? "void" : ""}"><span class="tag">Ván ${n + 1} · ${fmtTime(g.started)}${m.durationMs ? " · " + fmtDur(m.durationMs) : ""}</span>
        <span class="res grow"><b>${esc(teamName(g.win))}</b> thắng ${esc(teamName(g.lose))}</span>
        ${g.voided ? `<span class="tag v">Admin đã xoá kết quả</span>` : g.disputed ? `<span class="tag v" title="Kết quả chỉ có từ máy một người chơi, chưa được máy đối thủ xác nhận">Chờ admin xác nhận</span>` : !g.counted ? `<span class="tag">không tính (${isRR(D.tour) ? "cặp đấu" : "nhánh"} đã có kết quả)</span>` : ""}
        ${m.hasReplay ? `<a class="btn ghost tiny" href="/api/replays/${g.matchId}.aoerep">Tải replay</a><a class="btn ghost tiny" href="/lich-su-tran/#tran-${g.matchId}">Thống kê</a>` : ""}
        ${isAdmin && g.disputed && !g.voided ? `<button class="primary tiny" data-confirm="${g.matchId}">Xác nhận</button>` : ""}
        ${isAdmin ? `<button class="${g.voided ? "ghost" : "danger"} tiny" data-void="${g.matchId}" data-on="${g.voided ? 0 : 1}">${g.voided ? "Khôi phục" : "Xoá kết quả"}</button>` : ""}</li>`;
    }).join("")}</ul>` : `<p class="hint">Chưa có ván nào.</p>`;
    list = howto + list;
  }
  box.innerHTML = head + list;
  $("sclose").onclick = () => { openSeries = null; redraw(); };
  box.querySelectorAll("[data-confirm]").forEach((btn) => btn.onclick = async () => {
    btn.disabled = true;
    try {
      await api("tour/confirm", { id: tourId, matchId: Number(btn.dataset.confirm) }, "/api/admin/");
      await showTour();
    } catch (e) { alert(e.message); btn.disabled = false; }
  });
  box.querySelectorAll("[data-void]").forEach((btn) => btn.onclick = async () => {
    const on = btn.dataset.on === "1";
    if (on && !confirm("Xoá kết quả ván này? Ván không còn được tính, hai đội phải đấu lại.")) return;
    btn.disabled = true;
    try {
      await api("tour/void", { id: tourId, matchId: Number(btn.dataset.void), on }, "/api/admin/");
      await showTour();
    } catch (e) { alert(e.message); btn.disabled = false; }
  });
}

function rulesHtml(t) {
  return `<section class="rules">
    <h2>Luật và cách hoạt động</h2>
    <ul>
      <li><b>Chạm N</b>: đội nào thắng N trận trước thì thắng nhánh (cặp đấu). Chạm 2 = đánh tối đa 3 trận (BO3), chạm 3 = BO5.</li>
      ${!t || !isRR(t) ? `<li><b>Loại trực tiếp</b>: khi đến giờ bắt đầu, các đội đủ người được <b>chia nhánh ngẫu nhiên</b>; đội lẻ được đi thẳng vào vòng sau.</li>` : ""}
      ${!t || isRR(t) ? `<li><b>Vòng tròn tính điểm</b>: mỗi đội gặp tất cả các đội khác một lần, không xếp lịch: hai đội gặp nhau lúc nào cũng được trước hạn chót, kết quả tự vào bảng điểm. Thắng cặp đấu <b>3 điểm</b>, hoà 1, thua hoặc bỏ trận 0. Hết hạn mà chưa đủ số trận thắng: đội đang dẫn thắng, bằng nhau là hoà. Đội nhiều điểm nhất vô địch (bằng điểm xét hiệu số ván, số ván thắng, đối đầu).</li>` : ""}
      <li>Hai đội tự hẹn giờ và vào một phòng trên launcher SuperAqE: một đội ngồi bên trái, đội kia bên phải, đúng thành viên đã đăng ký.</li>
      <li><b>Kết quả lấy tự động</b> từ trận đấu (bên đầu hàng / bị diệt / thoát game trước là thua), công khai cùng replay. Trận ngắn dưới 5 phút không được tính. Kết quả mà máy đối thủ không xác nhận được sẽ chờ admin xác nhận.</li>
      ${!t || !isRR(t) ? `<li>Mỗi vòng có <b>hạn chót</b>. Nhánh loại trực tiếp chưa xong khi hết hạn: <b>cả hai đội bị loại</b>.</li>` : ""}
      <li>Không ai sửa được kết quả. Chỉ <b>admin</b> có quyền xoá kết quả một ván để hai đội đấu lại (ví dụ khi bị lỗi mạng).</li>
    </ul>
    ${t ? "" : `<p class="hint" style="margin:10px 0 0">Chưa có SuperAqE? <a href="/#tai-ve">Tải miễn phí cho Windows và MacBook</a>.</p>`}
  </section>`;
}

// ---------------- common
document.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => b.closest("dialog").close());
$("btnLogin").onclick = () => askLogin(() => tourId ? showTour() : showList());
$("loginDlg").addEventListener("close", () => { if (!me) pending = null; });
$("btnLogout").onclick = async () => {
  await api("logout", {}).catch(() => {});
  setMe(null);
  tourId ? showTour() : showList();
};
// Enter submits even while a Vietnamese input method is still composing a word (see /tai-khoan/).
$("loginForm").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.code !== "Enter" && e.code !== "NumpadEnter") return;
  if (e.target.tagName !== "INPUT") return;
  e.preventDefault();
  $("loginForm").requestSubmit();
});
$("loginForm").onsubmit = async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector("button");
  btn.disabled = true;
  $("loginMsg").textContent = "";
  try {
    await api("login", { username: $("lu").value.trim(), password: $("lp").value });
    $("lp").value = "";
    setMe(await api("me"));
    const then = pending;
    pending = null;
    $("loginDlg").close();
    if (then) await then(); else tourId ? showTour() : showList();
  } catch (err) {
    $("loginMsg").textContent = err.message;
  } finally {
    btn.disabled = false;
  }
};

(async () => {
  // An admin signed in on /admin (same site) sees the buttons that void a game's result.
  const [info] = await Promise.all([api("me").catch(() => null), fetch("/api/admin/me", { credentials: "same-origin" })
    .then((r) => r.ok ? r.json() : null).then((a) => { isAdmin = !!a?.email; }).catch(() => {})]);
  setMe(info);
  tourId ? showTour() : showList();
})();
</script>
